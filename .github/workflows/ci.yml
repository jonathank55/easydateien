name: CI

on:
  push:
  pull_request:

jobs:
  syntax-check:
    name: Python-Syntax prüfen
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntaxprüfung aller Python-Dateien
        run: |
          set -e
          failed=0
          for f in *.py easydateien; do
            [ -f "$f" ] || continue
            if python3 -m py_compile "$f"; then
              echo "OK: $f"
            else
              echo "FEHLER: $f"
              failed=1
            fi
          done
          exit $failed

      - name: Test-Suite ausführen
        run: python3 run_tests.py

  installationsmatrix:
    name: Installation in allen Modi
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation - frisch
        run: |
          export TESTHOME=$(mktemp -d)
          mkdir -p "$TESTHOME/.local/bin"
          HOME="$TESTHOME" bash install.sh

      - name: Installation - Update mit toten Symlinks (Reparaturfall)
        run: |
          export TESTHOME=$(mktemp -d)
          mkdir -p "$TESTHOME/.config/easydateien" "$TESTHOME/.local/bin"
          ln -s /nicht/vorhanden "$TESTHOME/.config/easydateien/easydateien_ui.py"
          ln -s /nicht/vorhanden "$TESTHOME/.config/easydateien/easydateien"
          HOME="$TESTHOME" bash install.sh

      - name: Installation - bestehende config.json bleibt unberührt
        run: |
          export TESTHOME=$(mktemp -d)
          mkdir -p "$TESTHOME/.config/easydateien" "$TESTHOME/.local/bin"
          echo '{"editor": "vim"}' > "$TESTHOME/.config/easydateien/config.json"
          HOME="$TESTHOME" bash install.sh
          grep -q '"editor": "vim"' "$TESTHOME/.config/easydateien/config.json"

      - name: Verifikation - fehlende Datei muss laut scheitern
        run: |
          export TESTHOME=$(mktemp -d)
          mkdir -p "$TESTHOME/.config/easydateien" "$TESTHOME/.local/bin"
          HOME="$TESTHOME" bash install.sh > /dev/null 2>&1
          rm "$TESTHOME/.config/easydateien/easydateien_view.py"
          # Verifikationsblock aus install.sh isoliert ausfuehren:
          CONFIG_DIR="$TESTHOME/.config/easydateien" bash -c '
            VERIFY_FILES=("easydateien" "easydateien_ui.py" "easydateien_actions.py" "easydateien_view.py" "easydateien_common.py" "easydateien_konfigurator.py")
            VERIFY_FAILED=0
            for DATEI in "${VERIFY_FILES[@]}"; do
              ZIEL="$CONFIG_DIR/$DATEI"
              if [ ! -f "$ZIEL" ] || { [ -L "$ZIEL" ] && [ ! -e "$ZIEL" ]; }; then
                echo "FEHLER: $ZIEL fehlt oder ist ein toter Symlink" >&2
                VERIFY_FAILED=1
              fi
            done
            exit $VERIFY_FAILED
          ' && {
            echo "FEHLER: Verifikation meldete Erfolg trotz fehlender Datei"; exit 1
          } || [ $? -eq 1 ]
