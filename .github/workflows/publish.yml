name: Veröffentlichen (GitHub & Homebrew)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'easydateien.rb'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: GitHub Release & Homebrew Tap Aktualisierung
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Git Benutzer konfigurieren
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release durchführen und Homebrew-Tap aktualisieren
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          python3 scripts/publish_release.py --ci
